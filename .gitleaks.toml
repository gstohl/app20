[extend]
useDefault = true

[[allowlists]]
description = "Ignored local runtime artifacts plus vendored deterministic signer and devnet fixtures; never source credentials"
paths = [
  '''(?:^|/)\.app20-localnet/''',
  '''^dist/''',
  '''^vendor/starknet-privacy/demo/\.env\.example$''',
  '''^vendor/starknet-privacy/client/tests/signers/snip12-call-set-signer\.test\.ts$''',
  '''^vendor/starknet-privacy/client/tests/signers/eip712-call-set-signer\.test\.ts$''',
  '''^vendor/starknet-privacy/crates/discovery-service/tests/fixtures/devnet-dump\.metadata\.json$''',
  '''^vendor/starknet-privacy/crates/discovery-core/tests/fixtures/devnet-state\.json$''',
  '''^vendor/starknet-privacy/crates/discovery-core/tests/fixtures/cairo-reference-data\.json$''',
  '''^vendor/starknet-privacy/e2e/tests/devnet/eth712-account\.test\.ts$''',
  '''^vendor/starknet-privacy/e2e/tests/devnet/signing-evm\.test\.ts$''',
  '''^vendor/starknet-privacy/proof-interceptor/tests/e2e\.test\.ts$''',
  '''^vendor/starknet-privacy/sdk/tests/fixtures/cairo-reference-data\.json$''',
  '''^vendor/starknet-privacy/sdk/tests/utils/encryption\.test\.ts$''',
  '''^workers/relay/test/security\.test\.ts$''',
  '''^scripts/fixtures/localnet-maker-a\.private\.json$''',
  '''^scripts/fixtures/localnet-maker-b\.private\.json$''',
]

[[allowlists]]
description = "Reviewed public Starknet addresses and class hashes in deployment configuration"
regexes = [
  '''0x0254a6b2997ef52e9f830ce1f543f6b29768295e8d17e2267d672c552cfe0d91''',
  '''0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d''',
  '''0x073414441639dcd11d1846f287650a00c60c416b9d3ba45d31c651672125b2c2''',
  '''0123456789abcdef0123456789abcdef''',
  '''ACkAACBBhSMg/zZ0lfpSLJTLg685Hk6JAYOSclu/IJjdkxvEJAAEAAEAAQ==''',
]
