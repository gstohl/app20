name: CI and release integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Superseded pull-request pushes cancel their in-flight runs; main-branch runs
# always finish so attestation and signing evidence is never truncated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a full commit SHA so a moved tag cannot change the
# code executed by this workflow. The adjacent comment records the reviewed tag.
permissions:
  contents: read

env:
  # Node 24 LTS is the workspace support floor: packages/privy declares
  # engines >=24 and workers/relay runs TypeScript test files directly under
  # node --test, which needs the default type stripping absent from 22.14.
  NODE_VERSION: 24.12.0

jobs:
  cairo-contracts:
    name: Cairo formatting, build, and mocked-pool unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Scarb 2.18.0
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1
        with:
          scarb-version: 2.18.0
          scarb-lock: cairo/Scarb.lock
      - name: Install pinned Starknet Foundry 0.63.0
        uses: foundry-rs/setup-snfoundry@ee00ea3f026379008ca40a54448d4059233d06cc # v4
        with:
          starknet-foundry-version: 0.63.0
      - name: Record the exact Cairo toolchain
        run: |
          scarb --version
          snforge --version
      - name: Check Cairo formatting
        working-directory: cairo
        run: scarb fmt --check
      - name: Build Cairo contracts from the committed lockfile
        working-directory: cairo
        run: scarb build
      - name: Fail if dependency resolution changed the Cairo lockfile
        run: git diff --exit-code -- cairo/Scarb.lock
      - name: Run Cairo unit tests with mocked pool callers
        working-directory: cairo
        run: snforge test

  real-pool-integration:
    name: Real privacy-pool devnet integration proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the pinned Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked root dependencies used by the APP20 mail harness
        run: npm ci
      - name: Install the locked real-pool toolchain and dependencies
        run: npm run pool:setup
      - name: Run the genuine privacy-pool devnet harness
        run: npm run test:e2e:pool

  verify:
    name: Existing release gates and first build (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the pinned Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build workspace outputs required by application imports
        run: npm run build:packages
      - name: Typecheck application
        run: npm run typecheck
      - name: Typecheck packages
        run: npm run typecheck:packages
      - name: Run all existing tests
        run: npm run test:all
      - name: Build frontend and workspace package outputs
        run: npm run build
      - name: Deterministically bundle the shipping Worker without deploying
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --dry-run --outdir release-worker
          # Wrangler's README contains a generation timestamp and is not deployed.
          rm release-worker/README.md
      - name: Check production CSP
        run: npm run check:csp
      - name: Check same-runner build determinism
        run: npm run check:build-determinism
      - name: Capture the complete deployable artifact set and committed SBOM digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            release-artifacts/app \
            release-artifacts/worker \
            release-artifacts/packages/privy/dist \
            release-artifacts/deployment \
            release-metadata
          cp -a dist/. release-artifacts/app/
          cp -a release-worker/. release-artifacts/worker/
          cp -a packages/privy/dist/. release-artifacts/packages/privy/dist/
          cp wrangler.jsonc release-artifacts/deployment/wrangler.jsonc
          (
            cd release-artifacts
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > release-metadata/artifact-manifest.sha256
          sha256sum docs/evidence/app20-sbom.cdx.json > release-metadata/committed-sbom.sha256
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "app20-release-${GITHUB_SHA}.tar.gz" \
            release-artifacts \
            release-metadata/artifact-manifest.sha256 \
            release-metadata/committed-sbom.sha256 \
            docs/evidence/app20-sbom.cdx.json
      - name: Upload first-build evidence for comparison and release jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app20-build-${{ github.sha }}
          path: |
            app20-release-${{ github.sha }}.tar.gz
            release-metadata/artifact-manifest.sha256
            release-metadata/committed-sbom.sha256
          if-no-files-found: error
          retention-days: 14

  reproduce-second-runner:
    name: Compare second runner environment (Ubuntu 22.04)
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the same exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the same pinned Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Download the first runner's artifact hashes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app20-build-${{ github.sha }}
          path: first-build
      - name: Install locked dependencies
        run: npm ci
      - name: Rebuild frontend and workspace package outputs on the second runner image
        run: npm run build
      - name: Rebundle the shipping Worker without deploying
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --dry-run --outdir release-worker
          # Exclude the same non-deployed, timestamped metadata as the first job.
          rm release-worker/README.md
      - name: Fail if any deployable artifact hash differs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            release-artifacts/app \
            release-artifacts/worker \
            release-artifacts/packages/privy/dist \
            release-artifacts/deployment
          cp -a dist/. release-artifacts/app/
          cp -a release-worker/. release-artifacts/worker/
          cp -a packages/privy/dist/. release-artifacts/packages/privy/dist/
          cp wrangler.jsonc release-artifacts/deployment/wrangler.jsonc
          (
            cd release-artifacts
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > second-runner-artifact-manifest.sha256
          diff -u \
            first-build/release-metadata/artifact-manifest.sha256 \
            second-runner-artifact-manifest.sha256

  attest-and-sign:
    name: Attest and keylessly sign main-branch bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - cairo-contracts
      - real-pool-integration
      - verify
      - reproduce-second-runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact attested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the verified first-runner bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app20-build-${{ github.sha }}
          path: release
      - name: Bind the uploaded SBOM digest to the checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check release/release-metadata/committed-sbom.sha256
      - name: Attest the release artifact bundle
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/app20-release-${{ github.sha }}.tar.gz
      - name: Attest the committed SBOM digest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: docs/evidence/app20-sbom.cdx.json
      - name: Install Cosign for GitHub OIDC keyless signing
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Keylessly sign the release artifact bundle
        shell: bash
        env:
          BUNDLE: release/app20-release-${{ github.sha }}.tar.gz
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --bundle "${BUNDLE}.sigstore.json" \
            "${BUNDLE}"
      - name: Upload the signed bundle and offline-verifiable signing material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app20-signed-release-${{ github.sha }}
          path: |
            release/app20-release-${{ github.sha }}.tar.gz
            release/app20-release-${{ github.sha }}.tar.gz.sigstore.json
            release/release-metadata/artifact-manifest.sha256
            release/release-metadata/committed-sbom.sha256
          if-no-files-found: error
          retention-days: 30
